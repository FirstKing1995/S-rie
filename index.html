<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141C33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Série</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141C33; --ink2:#1B2542; --ink3:#27345A;
  --bone:#EEE7D7; --bone2:#C9C2B2; --muted:#8E98B3;
  --gold:#D9A441; --gold2:#F0C46A; --coral:#E3705F;
  --line:rgba(238,231,215,.12);
  --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px);
  --display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
a{color:inherit}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.tela{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px calc(120px + var(--safe-b));min-height:100dvh}
.tela.com-nav{padding-bottom:calc(var(--nav-h) + 130px + var(--safe-b))}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 0 18px}
.ola{font-size:15px;color:var(--bone2)}
.link{padding:8px 10px;color:var(--muted);font-size:14px;border-radius:8px;text-decoration:none}
.link:hover{color:var(--bone)}
.voltar{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px 0 6px;margin:0 0 10px -6px;border-radius:999px;color:var(--bone2);text-decoration:none;font-weight:500;font-size:15px}
.voltar:hover{background:var(--ink2);color:var(--bone)}
.display{font-family:var(--display);font-weight:800;line-height:.88}
.titulo{font-size:clamp(54px,15vw,84px);margin-bottom:8px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:15px}
.desc{color:var(--bone2);line-height:1.65;max-width:62ch;white-space:pre-line}
.rot2{font-size:15px;font-weight:600;color:var(--bone2);margin:26px 0 10px}
.vazio{padding:28px 0;color:var(--muted)}
.vazio .btn{margin-top:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;font-weight:600;font-size:16px;text-decoration:none;transition:transform .12s,background-color .15s,border-color .15s;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn-ouro{background:var(--gold);color:var(--ink)}
.btn-ouro:hover{background:var(--gold2)}
.btn-linha{border:1.5px solid var(--line);color:var(--bone)}
.btn-linha:hover{border-color:var(--bone2)}
.btn-perigo{color:var(--coral);border:1.5px solid rgba(227,112,95,.35)}
.btn[disabled],.btn.desativado{opacity:.38;pointer-events:none}
.btn-p{min-height:40px;padding:0 16px;font-size:14px}
.btn:focus-within{outline:2px solid var(--gold2);outline-offset:3px}
.largo{width:100%}
.linha-btns{display:flex;gap:8px;flex-wrap:wrap}
.linha-btns .btn{flex:1}

.campo{display:block;margin-bottom:16px}
.campo>span,.rotulo{display:block;font-size:14px;color:var(--bone2);margin-bottom:6px}
.campo small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
input:not([type=checkbox]):not([type=file]),textarea,select{width:100%;background:var(--ink2);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical}
.duas{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;margin:6px 0 18px;font-size:15px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--gold);flex:none;margin-top:1px}
.erro{color:var(--coral);font-size:14px;min-height:20px;margin:6px 0}

/* navegação inferior */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(20,28,51,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:30}
.nav a{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:500;position:relative}
.nav a.ativo{color:var(--gold)}
.badge{position:absolute;top:7px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--coral);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.badge-inline{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--coral);color:#fff;font-size:12px;font-weight:700;margin-left:6px}
body.digitando .nav{display:none}

/* login */
.login{display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:48px}
.marca{font-size:clamp(110px,36vw,190px);color:var(--bone);margin-bottom:10px;letter-spacing:-.01em}
.login .sub{max-width:30ch;margin-bottom:36px;font-size:16px}
.alternar{text-align:center;margin-top:16px;color:var(--muted);font-size:15px}
.alternar a{color:var(--gold);font-weight:600;text-decoration:none}

/* onboarding */
.passo{font-size:14px;color:var(--muted);margin:20px 0 10px}
.pergunta{font-family:var(--display);font-weight:800;font-size:clamp(46px,12.5vw,68px);line-height:.95;margin-bottom:28px;max-width:12ch}
.opcoes{display:grid;gap:10px}
.opcao{text-align:left;padding:18px 20px;border-radius:14px;border:1.5px solid var(--line);font-size:17px;font-weight:500;transition:border-color .15s,background-color .15s}
.opcao:hover{border-color:var(--bone2)}
.opcao.sel{border-color:var(--gold);background:rgba(217,164,65,.1)}
.nav-onb{display:flex;gap:10px;margin-top:22px}
.nav-onb .btn-ouro{flex:1}

/* treino do aluno */
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:26px}
.dia{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0 8px;border-radius:12px;color:var(--muted);font-size:13px;font-weight:500}
.dia .marca-dia{height:14px;display:grid;place-items:center}
.dia .ponto{width:5px;height:5px;border-radius:50%;background:transparent}
.dia.tem .ponto{background:var(--muted)}
.dia.ativo.tem .ponto{background:var(--gold)}
.dia svg.ic{width:14px;height:14px;stroke:var(--gold);stroke-width:2.6}
.dia.hoje{color:var(--bone)}
.dia.hoje>span:first-child{box-shadow:0 2px 0 var(--gold)}
.dia.ativo{background:var(--ink3);color:var(--bone)}
.hero-dia h1{font-size:clamp(76px,23vw,128px);color:var(--bone)}
.hero-dia .sub{margin-top:10px;font-size:16px}
.aviso{background:var(--ink2);border-left:3px solid var(--gold);padding:12px 14px;border-radius:0 10px 10px 0;font-size:15px;margin:18px 0 0}
.aviso .linha-btns{margin-top:10px}
.lista-ex{list-style:none;padding:0;border-top:1px solid var(--line);margin:22px 0 8px}
.lista-ex li button{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.lista-ex .n{font-family:var(--display);font-weight:700;color:var(--muted);font-size:19px}
.nome{font-weight:500}
.foco{font-size:13px;color:var(--muted)}
.lista-ex .sr{font-family:var(--display);font-weight:700;font-size:23px;color:var(--gold);white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stats div,.numeros div{background:var(--ink2);border-radius:12px;padding:12px 14px}
.stats b,.numeros b{display:block;font-family:var(--display);font-size:34px;font-weight:700;line-height:1;margin-bottom:4px}
.stats span,.numeros span{font-size:12.5px;color:var(--muted);line-height:1.3;display:block}
.numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.numeros b.menor{font-size:24px;line-height:1.2}
.bloco{margin-top:40px}
.bloco>h2{font-size:15px;font-weight:600;color:var(--bone2);margin-bottom:12px}
.recado{display:block;background:var(--ink2);border-radius:14px;padding:16px 18px;text-decoration:none}
.recado-topo{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px;color:var(--bone2)}
.personal-chip{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--bone2);font-size:14px}
.personal-chip .avatar{width:32px;height:32px;font-size:12px}

.hist{list-style:none;padding:0;border-top:1px solid var(--line)}
.hist li{padding:14px 0;border-bottom:1px solid var(--line)}
.hist-top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:2px}
.hist-top span{color:var(--muted)}
.hist p{font-size:15px;color:var(--bone2)}
.cans{display:flex;align-items:center;gap:4px;margin-top:6px}
.cans i{width:14px;height:6px;border-radius:3px;background:var(--line)}
.cans i.on{background:var(--coral)}
.cans span{font-size:13px;color:var(--muted);margin-left:6px}
.coment{font-style:italic;margin-top:4px}

.rodape{position:fixed;left:0;right:0;bottom:0;padding:24px 20px calc(14px + var(--safe-b));background:linear-gradient(to bottom,rgba(20,28,51,0),var(--ink) 38%);z-index:20}
.rodape.acima-nav{bottom:calc(var(--nav-h) + var(--safe-b));padding-bottom:12px}
.rodape>div{max-width:520px;margin:0 auto}

/* mídia protegida */
.midia{position:relative;aspect-ratio:4/3;background:var(--ink2);border-radius:18px;overflow:hidden;display:grid;place-items:center;margin-bottom:22px}
.img-prot{background-size:cover;background-position:center;background-repeat:no-repeat;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cobre{position:absolute;inset:0}
.ph{font-family:var(--display);font-weight:800;font-size:clamp(52px,17vw,104px);color:transparent;-webkit-text-stroke:1.5px rgba(142,152,179,.45);padding:0 12px;text-align:center;line-height:.9}
.play{position:absolute;left:14px;bottom:14px;display:inline-flex;align-items:center;gap:8px;background:rgba(20,28,51,.88);color:var(--bone);padding:10px 18px 10px 14px;border-radius:999px;font-weight:600;font-size:14px;z-index:2}
.play svg{width:16px;height:16px;fill:var(--gold);stroke:none}
.video{position:relative;aspect-ratio:1/1;max-height:72dvh;background:#000;border-radius:18px;overflow:hidden;margin:0 auto 22px}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.video .tampa{position:absolute;top:0;right:0;width:72px;height:64px;z-index:2}
.aviso-video{font-size:13px;color:var(--muted);margin:-12px 0 18px}

/* execução */
.progresso{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 18px}
.progresso i{display:block;height:100%;background:var(--gold);transition:width .3s}
.ex-nome{font-size:24px;font-weight:600;line-height:1.2;margin-bottom:6px}
.carga{display:flex;align-items:baseline;gap:.06em;font-family:var(--display);font-weight:800;color:var(--gold);line-height:.82;font-size:clamp(104px,34vw,176px);margin:6px 0 2px}
.carga .x{font-size:.42em;color:var(--bone2);font-weight:600;padding:0 .04em}
.carga.longa{font-size:clamp(64px,18vw,104px)}
.carga-leg{color:var(--muted);font-size:15px;margin-bottom:22px}
.series{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}
.serie{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--display);font-weight:700;font-size:21px;transition:background-color .15s,border-color .15s}
.serie.feita{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.descanso-pref{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:16px}
.descanso{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--ink2);border-radius:12px;padding:10px 12px 10px 16px;margin-bottom:16px}
.descanso b{font-family:var(--display);font-size:32px;color:var(--gold2);line-height:1}
.nav-exec{display:grid;grid-template-columns:auto 1fr;gap:10px}
.fim{font-size:clamp(96px,30vw,160px);color:var(--gold);margin:10px 0 12px}
.escala{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.escala button{padding:12px 0 9px;border-radius:12px;border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px}
.escala b{font-family:var(--display);font-size:30px;line-height:1}
.escala small{font-size:11px;color:var(--muted)}
.escala button[aria-checked="true"]{border-color:var(--coral);background:rgba(227,112,95,.14)}

/* avatar e cartão da personal */
.avatar{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--ink3);color:var(--bone2);font-weight:600;font-size:14px;overflow:hidden;flex:none}
.avatar i{position:absolute;inset:0;background-size:cover;background-position:center;-webkit-touch-callout:none}
.avatar.g{width:64px;height:64px;font-size:21px}
.avatar.xg{width:120px;height:120px;font-size:36px}
.pcard{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:16px;padding:18px;margin-bottom:12px}
button.pcard:hover{border-color:var(--bone2)}
.pcard.sel{border-color:var(--gold);background:rgba(217,164,65,.08)}
.pcard-topo{display:flex;gap:14px;align-items:center;margin-bottom:10px}
.pcard h3{font-size:19px;font-weight:600;line-height:1.25}
.pcard-desc{color:var(--bone2);font-size:15px;line-height:1.55;margin-bottom:10px;white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--ink3);color:var(--bone2)}
.pcard .linha-btns{margin-top:14px}

/* painel da personal */
.aluno{padding:24px 0;border-bottom:1px solid var(--line)}
.aluno-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.aluno h2{font-family:var(--display);font-size:52px;font-weight:800;line-height:.9}
.aluno h2 a{text-decoration:none}
.aluno .perfil{color:var(--muted);font-size:14px;margin:8px 0 16px}
.grupo-titulo{font-size:15px;font-weight:600;color:var(--bone2);margin:34px 0 0;padding-bottom:10px;border-bottom:1px solid var(--line)}
.cab-aluno{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.abas{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.aba{padding:10px 12px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;text-decoration:none;white-space:nowrap}
.aba.ativa{color:var(--bone);border-color:var(--gold)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{position:relative;padding:7px 13px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;color:var(--bone2);white-space:nowrap}
.chip.ativo,.chip[aria-pressed="true"]{border-color:var(--gold);color:var(--bone);background:rgba(217,164,65,.12)}
.chip.tem::after{content:"";position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
.chip.sujo{border-style:dashed}
.pend{font-size:13px;color:var(--coral);font-weight:500;margin-left:8px}
.editor-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 8px}
.editor-topo .rot2{margin:0}
.editor-topo select{width:auto;max-width:52%;padding:8px 10px;font-size:14px}
.edit-ex{padding:14px 0;border-bottom:1px solid var(--line)}
.edit-info{display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.edit-info .n{font-family:var(--display);font-weight:700;color:var(--muted);font-size:18px;width:20px;flex:none}
.edit-ctrl{display:grid;grid-template-columns:72px 1fr auto auto;gap:8px;align-items:end;padding-left:30px}
.edit-ctrl label{font-size:12px;color:var(--muted)}
.edit-ctrl input{padding:9px 8px!important;text-align:center;margin-top:3px}
.mover{display:flex;gap:4px}
.ic-btn{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);display:grid;place-items:center;color:var(--bone2)}
.ic-btn:hover{border-color:var(--bone2)}
.ic-btn[disabled]{opacity:.3;pointer-events:none}
.ic-btn.rm{color:var(--coral);border-color:rgba(227,112,95,.3)}
.ic-btn svg.ic{width:18px;height:18px}
.acoes-edit{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:22px}

/* evolução */
.peso-hero{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.peso-num{font-size:clamp(100px,31vw,156px);color:var(--bone)}
.peso-kg{font-family:var(--display);font-size:38px;color:var(--muted);font-weight:700}
.peso-var{font-size:16px;color:var(--bone2);margin-top:8px}
.peso-var b{color:var(--gold);font-weight:600}
.meta{margin-top:18px}
.meta-barra{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.meta-barra i{display:block;height:100%;background:var(--gold);border-radius:4px}
.grafico{width:100%;height:auto;display:block;overflow:visible}
.grafico text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.tabela{width:100%;border-collapse:collapse;font-size:15px}
.tabela th{font-weight:500;color:var(--muted);font-size:13px;text-align:right;padding:0 0 8px}
.tabela th:first-child,.tabela td:first-child{text-align:left}
.tabela td{padding:11px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.medida{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.medida p{font-size:14px;color:var(--bone2)}
.medida .sub{font-size:13px}

/* exercícios (gestão) */
.busca-linha{display:grid;grid-template-columns:1fr auto;gap:8px;margin:14px 0 4px}
.busca-linha select{width:auto}
.ex-row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.ex-row .info{flex:1;min-width:0}
.thumb{position:relative;width:64px;height:64px;border-radius:12px;background:var(--ink2);flex:none;overflow:hidden;display:grid;place-items:center;color:var(--muted);font-family:var(--display);font-weight:700;font-size:13px;text-align:center;line-height:1;padding:4px}
.thumb .img-prot{position:absolute;inset:0}
.selo{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin:4px 4px 0 0}
.selo.ouro{border-color:rgba(217,164,65,.5);color:var(--gold)}
.selo.coral{border-color:rgba(227,112,95,.45);color:var(--coral)}
.upl{border:1.5px dashed var(--line);border-radius:14px;padding:14px;margin-bottom:18px}
.upl-prev{border-radius:10px;overflow:hidden;margin-bottom:12px;background:var(--ink2)}
.upl-prev .img-prot{aspect-ratio:4/3}
.upl-prev .video{margin:0;border-radius:10px}
.upl-vazio{padding:22px 0;text-align:center;color:var(--muted);font-size:14px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.prog-txt{font-size:13px;color:var(--muted)}
.upl-link{margin-top:12px}
.upl-link input{font-size:14px;padding:10px 12px!important}
.foto-perfil{display:flex;gap:18px;align-items:center;margin-bottom:22px}

/* admin */
.hub a{display:block;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none}
.hub h2{font-family:var(--display);font-size:44px;font-weight:800;line-height:.9;margin-bottom:6px}
.u-row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.u-row .sub{font-size:13.5px}

/* chat */
.chat-tela{padding-bottom:0}
.chat-cab{display:flex;align-items:center;gap:10px;padding:4px 0 12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--ink);z-index:5}
.chat-cab .voltar{margin:0}
.chat-cab .quem{flex:1;min-width:0}
.chat-cab .quem b{display:block;font-weight:600;line-height:1.2}
.chat-cab .quem span{font-size:13px;color:var(--muted)}
.chat-lista{display:flex;flex-direction:column;gap:6px;padding:14px 0 calc(190px + var(--nav-h) + var(--safe-b))}
.chat-tela.sem-nav .chat-lista{padding-bottom:calc(170px + var(--safe-b))}
.dia-sep{align-self:center;font-size:12px;color:var(--muted);background:var(--ink2);padding:4px 12px;border-radius:999px;margin:14px 0 6px}
.msg{max-width:84%;padding:10px 14px 8px;border-radius:18px 18px 18px 5px;background:var(--ink2);font-size:15.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}
.msg.minha{align-self:flex-end;background:var(--ink3);border-radius:18px 18px 5px 18px}
.msg.seguida{margin-top:-3px}
.msg.enviando{opacity:.55}
.msg time{display:block;font-size:11px;color:var(--muted);margin-top:3px;text-align:right}
.msg .autor{display:block;font-size:12px;color:var(--gold);font-weight:600;margin-bottom:2px}
.lida{align-self:flex-end;font-size:11.5px;color:var(--muted);margin:0 4px}
.chat-rodape{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));background:var(--ink);border-top:1px solid var(--line);padding:10px 16px 12px;z-index:25}
.chat-tela.sem-nav .chat-rodape,body.digitando .chat-rodape{bottom:0;padding-bottom:calc(12px + var(--safe-b))}
.chat-rodape>div{max-width:528px;margin:0 auto}
.rapidas{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.rapidas::-webkit-scrollbar{display:none}
.enviar{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}
.enviar textarea{max-height:140px;min-height:48px;border-radius:24px;padding:12px 18px;resize:none;line-height:1.4}
.btn-enviar{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--ink);display:grid;place-items:center}
.btn-enviar[disabled]{opacity:.4}
.btn-enviar svg.ic{width:20px;height:20px;stroke-width:2.2}

/* modal */
.modal-fundo{position:fixed;inset:0;background:rgba(9,13,26,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal{background:var(--ink2);width:100%;max-width:560px;max-height:90dvh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:sobe .22s ease-out}
.modal-cab{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.modal-cab h2{font-size:18px;font-weight:600}
.modal-linha{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-linha+*{margin-top:12px}
.modal-corpo{overflow:auto;padding:16px 20px calc(20px + var(--safe-b))}
.modal input:not([type=checkbox]):not([type=file]),.modal select,.modal textarea{background:var(--ink)}
.modal .midia,.modal .video{margin-bottom:16px}
.lib-ex{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lib-ex .info{flex:1;min-width:0}
.lib-ex .thumb{width:52px;height:52px}
@keyframes sobe{from{transform:translateY(28px);opacity:0}}
@media (min-width:640px){.modal-fundo{align-items:center}.modal{border-radius:20px}}

.carregando{display:grid;place-items:center;min-height:70dvh;color:var(--muted);text-align:center}
.barra{width:64px;height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 auto 14px;position:relative}
.barra::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:vai 1s ease-in-out infinite alternate}
@keyframes vai{to{transform:translateX(150%)}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 96px + var(--safe-b));transform:translate(-50%,12px);background:var(--bone);color:var(--ink);padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
const API_URL = 'COLE_AQUI_A_URL_DO_WEB_APP';
const VIDEO_SANDBOX = true; // bloqueia o botão "abrir no Drive" do player. Se o vídeo não tocar, troque para false.

/* ---------- constantes ---------- */
const DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const CURTO = {Segunda:'Seg',Terça:'Ter',Quarta:'Qua',Quinta:'Qui',Sexta:'Sex',Sábado:'Sáb',Domingo:'Dom'};
const FOCOS = ['Pernas','Glúteos','Peito','Costas','Ombros','Braços','Core','Cardio'];
const NIVEIS = ['Leve','Tranquilo','Moderado','Pesado','Exausto'];
const OBJETIVOS = [['Emagrecimento','Emagrecer'],['Hipertrofia','Ganhar massa muscular'],['Condicionamento','Ter mais fôlego e disposição'],['Saúde e bem-estar','Cuidar da saúde']];
const LOCAIS = [['Casa','Em casa, sem aparelhos'],['Academia','Na academia']];
const TEMPOS = [['30','30 minutos'],['45','45 minutos'],['60','1 hora']];
const GENEROS = [['Feminino','Feminino'],['Masculino','Masculino'],['Prefiro não dizer','Prefiro não dizer']];
const PASSOS = [
  {chave:'genero',   tipo:'opcoes', titulo:'Como você se identifica?', opcoes:GENEROS},
  {chave:'objetivo', tipo:'opcoes', titulo:'Qual seu objetivo principal?', opcoes:OBJETIVOS},
  {chave:'local',    tipo:'opcoes', titulo:'Onde você vai treinar?', opcoes:LOCAIS},
  {chave:'tempo',    tipo:'opcoes', titulo:'Quanto tempo você tem por dia?', opcoes:TEMPOS},
  {chave:'corpo',    tipo:'corpo',  titulo:'Seu ponto de partida'},
  {chave:'personal', tipo:'personal', titulo:'Quem vai te acompanhar?'}
];
const RAPIDAS_PERSONAL = ['Ótimo treino! 💪','Como você está se sentindo?','Aumente a carga no próximo treino','Lembre de beber bastante água','Descanse bem hoje'];
const RAPIDAS_ALUNO = ['Treino feito! ✅','Senti dor em um exercício','Posso trocar um exercício?','Estou sem tempo hoje'];
const MEDIDAS = [['cintura','Cintura','cm'],['quadril','Quadril','cm'],['braco','Braço','cm'],['coxa','Coxa','cm'],['gordura','Gordura corporal','%']];

const P = d => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  treino: P('<path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/>'),
  evolucao: P('<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>'),
  chat: P('<path d="M20.5 12a8.5 8.5 0 0 1-12.3 7.6L3.5 20.5l1-4.4A8.5 8.5 0 1 1 20.5 12z"/>'),
  perfil: P('<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>'),
  admin: P('<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z"/>'),
  alunos: P('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.6-5.5 6.5-5.5s5.5 2 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18.5 14.8c1.6.8 2.6 2.4 3 5.2"/>'),
  exercicios: P('<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/>'),
  usuarios: P('<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/>'),
  voltar: P('<path d="M15 5l-7 7 7 7"/>'),
  enviar: P('<path d="M4.5 12L20 4.5 13.5 20l-2-6.5z"/>'),
  play: '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  check: P('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  cima: P('<path d="M6 15l6-6 6 6"/>'),
  baixo: P('<path d="M6 9l6 6 6-6"/>'),
  x: P('<path d="M6 6l12 12M18 6L6 18"/>')
};

const $app = document.getElementById('app');
const st = {aluno:null, diaSel:null, exec:null, dash:null, lib:null, exs:null, det:null, onb:null, timer:null, intervalos:[], naoLidas:0, guarda:null, hashAtual:'', enviando:0};

/* ---------- utilidades ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const diaHoje = () => DIAS[(new Date().getDay() + 6) % 7];
function on(sel, ev, fn, root = document){ const el = root.querySelector(sel); if (el) el.addEventListener(ev, fn); return el; }
function onAll(sel, ev, fn, root = document){ root.querySelectorAll(sel).forEach(el => el.addEventListener(ev, e => fn(e, el))); }
const fmtNum = (v, dec = 1) => Number(v).toLocaleString('pt-BR', {maximumFractionDigits:dec});
const lerNum = v => String(v ?? '').trim().replace(',', '.');
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;
function fmtData(iso){
  if (!iso) return '';
  const d = new Date(iso), h = new Date(), z = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const diff = Math.round((z(h) - z(d)) / 864e5);
  if (diff === 0) return 'Hoje';
  if (diff === 1) return 'Ontem';
  if (diff > 1 && diff < 7) return `Há ${diff} dias`;
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
}
const fmtLonga = iso => new Date(iso).toLocaleDateString('pt-BR', {day:'numeric', month:'long'});
const fmtHoraCurta = iso => new Date(iso).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
const hojeIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };

const guardado = chave => ({
  get(){ try { return JSON.parse(localStorage.getItem(chave)); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(chave, JSON.stringify(v)); } catch(e){} },
  limpar(){ try { localStorage.removeItem(chave); } catch(e){} }
});
const sessao = guardado('serie_sessao');
const execSalvo = guardado('serie_exec');
const prefDescanso = guardado('serie_descanso');

async function api(action, dados = {}){
  if (API_URL.startsWith('COLE')) throw new Error('Configure a API_URL no topo do index.html com a URL do Apps Script.');
  const s = sessao.get();
  let r;
  try {
    r = await fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, token:s && s.token, dados})});
  } catch(e){ throw new Error('Sem conexão com o servidor. Verifique sua internet e tente de novo.'); }
  let j;
  try { j = await r.json(); } catch(e){ throw new Error('O servidor respondeu de um jeito inesperado. Confira se o App da Web está implantado com acesso para "Qualquer pessoa".'); }
  if (!j.ok){
    if (j.codigo === 'SESSAO'){ sessao.limpar(); toast(j.erro); ir('#/entrar'); throw Object.assign(new Error(j.erro), {sessao:true}); }
    throw new Error(j.erro);
  }
  return j.data;
}
async function tentar(fn, n = 3){
  for (let i = 0; ; i++){
    try { return await fn(); }
    catch(e){ if (e.sessao || i >= n - 1) throw e; await new Promise(r => setTimeout(r, 1500 * (i + 1))); }
  }
}
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2800); }
function msgErro(id, e){ if (e.sessao) return; const el = document.getElementById(id); if (el) el.textContent = e.message; else toast(e.message); }
function carregando(msg = 'Carregando…'){ $app.innerHTML = `<main class="tela"><div class="carregando"><div><div class="barra"></div><p>${esc(msg)}</p></div></div></main>`; }
function erroTela(e, tentarDeNovo){
  if (e.sessao) return;
  $app.innerHTML = `<main class="tela"><div class="carregando"><div style="max-width:34ch">
    <p class="erro" style="font-size:16px;margin-bottom:18px">${esc(e.message)}</p>
    <button class="btn btn-linha" id="tentar">Tentar de novo</button></div></div></main>`;
  on('#tentar','click',tentarDeNovo);
}
const ocupado = (b, txt) => { b.disabled = true; b.dataset.txt = b.textContent; b.textContent = txt; };
const livre = b => { b.disabled = false; if (b.dataset.txt) b.textContent = b.dataset.txt; };

/* ---------- mídia (Drive) ---------- */
function driveId(v){
  v = String(v || '').trim();
  if (!v) return '';
  if (!/^https?:/i.test(v)) return /^[\w-]{20,}$/.test(v) ? v : '';
  const m = v.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]+)/);
  return m ? m[1] : '';
}
function imgSrc(v, w = 1000){
  const id = driveId(v);
  if (id) return `https://drive.google.com/thumbnail?id=${id}&sz=w${w}`;
  return /^https?:/i.test(String(v || '')) ? String(v) : '';
}
function htmlImg(v, alt, cls = 'cobre', w){
  const src = imgSrc(v, w);
  return src ? `<div class="img-prot ${cls}" role="img" aria-label="${esc(alt)}" style="background-image:url('${esc(src)}')"></div>` : '';
}
function youtubeId(v){ const m = String(v || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/); return m ? m[1] : ''; }
function htmlVideo(v){
  const id = driveId(v), yt = youtubeId(v);
  const sb = VIDEO_SANDBOX ? 'sandbox="allow-scripts allow-same-origin allow-presentation"' : '';
  if (id) return `<div class="video"><iframe src="https://drive.google.com/file/d/${id}/preview" ${sb} allow="autoplay; fullscreen" allowfullscreen title="Vídeo do exercício"></iframe><div class="tampa" aria-hidden="true"></div></div>`;
  if (yt) return `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${yt}?rel=0&modestbranding=1" allow="autoplay; fullscreen; encrypted-media" allowfullscreen title="Vídeo do exercício"></iframe></div>`;
  if (/^https?:/i.test(String(v || ''))) return `<div class="video"><video src="${esc(v)}" controls playsinline preload="metadata" controlslist="nodownload noremoteplayback noplaybackrate" disablepictureinpicture></video></div>`;
  return '';
}
function midiaExercicio(ex){
  const temImg = !!imgSrc(ex.imagem), temVid = !!ex.video;
  if (temVid && !temImg) return htmlVideo(ex.video);
  return `<div class="midia"><span class="ph" aria-hidden="true">${esc(ex.foco || 'Série')}</span>${temImg ? htmlImg(ex.imagem, 'Demonstração: ' + ex.nome) : ''}${temVid ? `<button class="play" data-video>${ICON.play}<span>Ver vídeo</span></button>` : ''}</div>`;
}
function ligarPlay(root, ex){ onAll('[data-video]','click',(e, el) => { el.closest('.midia').outerHTML = htmlVideo(ex.video); }, root); }
function avatar(foto, nome, tam = ''){
  const src = imgSrc(foto, 400);
  const ini = esc(String(nome || '?').trim().split(/\s+/).map(x => x[0]).slice(0, 2).join('').toUpperCase());
  return `<span class="avatar ${tam}" aria-hidden="true"><span>${ini}</span>${src ? `<i style="background-image:url('${esc(src)}')"></i>` : ''}</span>`;
}
// dificulta salvar mídia (clique longo, arrastar, menu do botão direito)
document.addEventListener('contextmenu', e => { if (e.target.closest('.img-prot,.video,.avatar,.midia,.thumb')) e.preventDefault(); });
document.addEventListener('dragstart', e => { if (e.target.closest('.img-prot,.video,.midia')) e.preventDefault(); });

/* ---------- envio de arquivos para o Drive ---------- */
function paraBase64(blob){
  return new Promise((ok, falha) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => falha(new Error('Não foi possível ler o arquivo.')); r.readAsDataURL(blob); });
}
async function redimensionar(file, max){
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#1B2542'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(bmp, 0, 0, cv.width, cv.height);
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', .88));
    if (blob) return {blob, mime:'image/jpeg'};
  } catch(e){}
  return {blob:file, mime:file.type || 'image/jpeg'};
}
async function enviarArquivo(file, tipo, aoProgredir){
  let blob = file, mime = file.type || '';
  if (tipo === 'video'){ if (!mime.startsWith('video/')) throw new Error('Escolha um arquivo de vídeo.'); }
  else { if (mime && !mime.startsWith('image/')) throw new Error('Escolha um arquivo de imagem.'); ({blob, mime} = await redimensionar(file, tipo === 'foto' ? 800 : 1600)); }
  st.enviando++;
  try {
    const ini = await api('upload_iniciar', {tipo, mime, tamanho:blob.size, nome:file.name});
    let pos = 0, res = null;
    aoProgredir && aoProgredir(0);
    while (pos < blob.size){
      const fatia = blob.slice(pos, pos + ini.tamanho_parte);
      const dados = await paraBase64(fatia);
      const inicio = pos;
      res = await tentar(() => api('upload_parte', {upload_id:ini.upload_id, inicio, dados}));
      pos += fatia.size;
      aoProgredir && aoProgredir(pos / blob.size);
    }
    if (!res || !res.concluido) throw new Error('O envio não terminou. Tente de novo.');
    return res.id;
  } finally { st.enviando--; }
}
window.addEventListener('beforeunload', e => { if (st.enviando || (st.guarda && st.sujo)){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- modal ---------- */
function modal(html, {rotulo = 'Janela', aoFechar} = {}){
  const fundo = document.createElement('div');
  fundo.className = 'modal-fundo';
  fundo.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(rotulo)}">${html}</div>`;
  document.body.appendChild(fundo);
  const tecla = e => { if (e.key === 'Escape') fechar(); };
  function fechar(){ if (!fundo.isConnected) return; fundo.remove(); document.removeEventListener('keydown', tecla); aoFechar && aoFechar(); }
  document.addEventListener('keydown', tecla);
  fundo.addEventListener('click', e => { if (e.target === fundo) fechar(); });
  onAll('[data-fechar]','click',fechar,fundo);
  const foco = fundo.querySelector('input:not([type=checkbox]),textarea,select') || fundo.querySelector('button');
  if (foco) setTimeout(() => foco.focus(), 40);
  return {el:fundo, fechar};
}
const modalCab = (titulo, fecharTxt = 'Fechar') => `<div class="modal-cab"><div class="modal-linha"><h2>${esc(titulo)}</h2><button class="link" data-fechar>${fecharTxt}</button></div></div>`;

/* =========================================================
   ROTAS
   ========================================================= */
const ROTAS = [
  [/^#\/entrar$/, telaEntrar, {publica:true}],
  [/^#\/cadastro$/, telaCadastro, {publica:true}],
  [/^#\/boas-vindas$/, telaOnboarding, {papel:'aluno'}],
  [/^#\/treino$/, telaTreino, {papel:'aluno'}],
  [/^#\/treino\/executar$/, telaExec, {papel:'aluno'}],
  [/^#\/treino\/concluir$/, telaConclusao, {papel:'aluno'}],
  [/^#\/evolucao$/, telaEvolucaoAluno, {papel:'aluno'}],
  [/^#\/chat$/, () => telaChat(null), {papel:'aluno'}],
  [/^#\/personais$/, telaPersonais, {papel:'aluno'}],
  [/^#\/perfil$/, telaPerfil, {}],
  [/^#\/admin$/, telaAdmin, {papel:'admin'}],
  [/^#\/alunos$/, telaAlunos, {papel:'editor'}],
  [/^#\/alunos\/([\w-]+)\/chat$/, m => telaChat(m[1]), {papel:'editor'}],
  [/^#\/alunos\/([\w-]+)(?:\/(treino|evolucao|historico))?$/, m => telaAlunoDetalhe(m[1], m[2] || 'treino'), {papel:'editor'}],
  [/^#\/exercicios$/, telaExercicios, {papel:'editor'}],
  [/^#\/exercicios\/([\w-]+)$/, m => telaExercicioForm(m[1]), {papel:'editor'}],
  [/^#\/usuarios$/, telaUsuarios, {papel:'admin'}]
];
function home(s){ if (!s) return '#/entrar'; if (s.tipo === 'Aluno') return s.questionario ? '#/treino' : '#/boas-vindas'; return '#/alunos'; }
function temPapel(s, papel){
  if (!papel) return true;
  if (papel === 'aluno') return s.tipo === 'Aluno';
  if (papel === 'admin') return !!s.admin;
  if (papel === 'editor') return !!s.admin || s.tipo === 'Personal';
  return false;
}
function ir(h){ if (location.hash === h) rota(); else location.hash = h; }
function trocar(h){ if (location.hash === h) rota(); else location.replace(h); }
let ignorarProxima = false;
function limparTela(){
  st.intervalos.forEach(clearInterval); st.intervalos = [];
  pararTimer();
  document.querySelectorAll('.modal-fundo').forEach(m => m.remove());
  document.body.classList.remove('digitando');
}
function rota(){
  if (ignorarProxima){ ignorarProxima = false; return; }
  const h = location.hash || '';
  if (st.guarda && h !== st.hashAtual && !st.guarda(h)){ ignorarProxima = true; location.hash = st.hashAtual; return; }
  st.guarda = null; st.sujo = false;
  limparTela();
  const s = sessao.get();
  const achada = ROTAS.find(([re]) => re.test(h));
  if (!achada) return trocar(home(s));
  const [re, fn, op] = achada;
  if (!op.publica && !s) return trocar('#/entrar');
  if (op.publica && s) return trocar(home(s));
  if (s && !temPapel(s, op.papel)) return trocar(home(s));
  if (s && s.tipo === 'Aluno' && !s.questionario && h !== '#/boas-vindas') return trocar('#/boas-vindas');
  st.hashAtual = h;
  window.scrollTo(0, 0);
  fn(h.match(re));
}
window.addEventListener('hashchange', rota);

function sair(){ limparTela(); sessao.limpar(); execSalvo.limpar(); Object.assign(st, {aluno:null, diaSel:null, exec:null, dash:null, lib:null, exs:null, det:null, onb:null, naoLidas:0}); ir('#/entrar'); }

  }
  pagina(`<div class="topo"><p class="ola">Oi, ${esc(String(sessao.get().nome).split(' ')[0])}</p><button class="link" id="sairOnb">Sair</button></div>

  on('#oVoltar','click',() => { guardarCorpo(); o.i--; renderOnb(); });
  on('#oCont','click',() => { guardarCorpo(); o.i++; renderOnb(); });
  if (p.tipo === 'personal' && o.personais === null){
    api('listar_personais').then(l => { o.personais = l; if (st.onb === o) renderOnb(); }).catch(e => { o.personais = []; msgErro('eOnb', e); renderOnb(); });

function cardPersonal(p, {botao = false, sel = false, acoes = ''} = {}){

  const tag = botao ? 'button' : 'article';

async function telaTreino(){
  if (st.aluno) renderTreino(); else carregando('Buscando seu treino…');
  try {
    const antes = JSON.stringify(st.aluno);
    const novo = await api('obter_treino');
    st.aluno = novo;
    st.naoLidas = novo.nao_lidas || 0;
    if (!st.diaSel) st.diaSel = novo.hoje;
    if (location.hash === '#/treino' && JSON.stringify(novo) !== antes) renderTreino();
  } catch(e){ if (!st.aluno) erroTela(e, telaTreino); else if (!e.sessao) toast(e.message); }
}

        <span><span class="nome" style="display:block">${esc(x.nome)}</span><span class="foco">${esc(x.foco)}${x.video ? ', com vídeo' : ''}</span></span>

      : `<p class="desc" style="margin-top:14px">Descansar também faz parte do treino: é na recuperação que o músculo se reconstrói. Uma caminhada leve ou alongamento já ajudam.</p>`}

function previewExercicio(ex){
  const m = modal(`${modalCab(ex.nome)}<div class="modal-corpo">${midiaExercicio(ex)}
    <p style="margin:0 0 12px"><span style="font-family:var(--display);font-size:30px;color:var(--gold);font-weight:700">${esc(ex.series)}×${esc(ex.reps)}</span> <span class="sub">${esc(repsTxt(ex.series, ex.reps))}</span></p>
    ${ex.descricao ? `<p class="desc">${esc(ex.descricao)}</p>` : '<p class="sub">Sem descrição para este exercício.</p>'}</div>`, {rotulo:ex.nome});
  ligarPlay(m.el, ex);
}
function repsTxt(series, reps){
  const r = String(reps), s = parseInt(series) || 1;
  return `${plural(s, 'série', 'séries')} de ${/^\d+$/.test(r) ? r + ' repetições' : r}`;
}

/* ---------- execução ---------- */
function telaExec(){
  const s = sessao.get();
  st.exec = st.exec || execSalvo.get();
  if (!st.exec || st.exec.usuario !== s.id){ st.exec = null; return trocar('#/treino'); }
  renderExec();
}
function renderExec(){
  pararTimer();
  const e = st.exec, lista = e.treino.exercicios, ex = lista[e.idx], n = lista.length, ultimo = e.idx === n - 1;
  const total = Math.max(1, parseInt(ex.series) || 1), reps = String(ex.reps);
  const desc = prefDescanso.get() || 60;
  pagina(`<div class="topo"><p class="ola">Exercício ${e.idx + 1} de ${n}</p><a class="link" href="#/treino">Pausar</a></div>
    <div class="progresso" role="progressbar" aria-label="Progresso do treino" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${e.idx + 1}"><i style="width:${(e.idx + 1) / n * 100}%"></i></div>
    ${midiaExercicio(ex)}
    ${ex.video && driveId(ex.video) ? '<p class="aviso-video">Se o vídeo não carregar de primeira, espere alguns segundos e toque de novo.</p>' : ''}
    <h1 class="ex-nome">${esc(ex.nome)}</h1>
    <div class="carga ${reps.length > 3 ? 'longa' : ''}" aria-hidden="true"><span>${esc(ex.series)}</span><span class="x">×</span><span>${esc(reps)}</span></div>
    <p class="carga-leg">${esc(repsTxt(ex.series, reps))}</p>
    <p class="sub">Toque em cada série ao terminar</p>
    <div class="series">${Array.from({length:total}, (_, i) => `<button class="serie" data-i="${i}" aria-label="Série ${i + 1}">${i + 1}</button>`).join('')}</div>
    <div class="descanso-pref"><span>Descanso entre séries:</span>${[30, 45, 60, 90].map(sg => `<button class="chip" data-desc="${sg}" aria-pressed="${sg === desc}">${sg}s</button>`).join('')}</div>
    <div id="descanso" aria-live="polite"></div>
    ${ex.descricao ? `<h2 class="rot2">Como fazer</h2><p class="desc">${esc(ex.descricao)}</p>` : ''}
    <div class="rodape"><div class="nav-exec">
      <button class="btn btn-linha" id="ant" ${e.idx === 0 ? 'disabled' : ''}>Anterior</button>
      <button class="btn btn-ouro" id="prox">${ultimo ? 'Concluir treino' : 'Próximo exercício'}</button>
    </div></div>`, {nav:false});
  ligarPlay($app, ex);
  const salvar = () => execSalvo.set(e);
  const pintar = () => { const f = e.feitas[e.idx] || 0; document.querySelectorAll('.serie').forEach((b, i) => { b.classList.toggle('feita', i < f); b.setAttribute('aria-pressed', i < f); }); };
  pintar();
  onAll('.serie','click',(ev, el) => {
    const i = +el.dataset.i, antes = e.feitas[e.idx] || 0;
    e.feitas[e.idx] = i < antes ? i : i + 1;
    pintar(); salvar();
    if (e.feitas[e.idx] > antes && e.feitas[e.idx] < total) iniciarDescanso(prefDescanso.get() || 60); else pararTimer();
  });
  onAll('[data-desc]','click',(ev, el) => { prefDescanso.set(+el.dataset.desc); document.querySelectorAll('[data-desc]').forEach(b => b.setAttribute('aria-pressed', b === el)); });
  on('#ant','click',() => { e.idx--; salvar(); renderExec(); window.scrollTo(0, 0); });
  on('#prox','click',() => { if (ultimo) return ir('#/treino/concluir'); e.idx++; salvar(); renderExec(); window.scrollTo(0, 0); });
}
function iniciarDescanso(seg){
  pararTimer();
  const box = document.getElementById('descanso'); if (!box) return;
  const fim = Date.now() + seg * 1000;
  const tick = () => {
    const r = Math.max(0, Math.round((fim - Date.now()) / 1000));
    if (r <= 0){ pararTimer(); if (navigator.vibrate) navigator.vibrate([150, 80, 150]); toast('Descanso encerrado. Bora pra próxima série.'); return; }
    box.innerHTML = `<div class="descanso"><span>Descanso</span><b>${Math.floor(r / 60)}:${String(r % 60).padStart(2, '0')}</b><button class="link" id="pularDesc">Pular</button></div>`;
    on('#pularDesc','click',pararTimer);
  };
  tick(); st.timer = setInterval(tick, 1000);
}
function pararTimer(){ clearInterval(st.timer); st.timer = null; const box = document.getElementById('descanso'); if (box) box.innerHTML = ''; }

function telaConclusao(){
  const s = sessao.get();
  st.exec = st.exec || execSalvo.get();
  if (!st.exec || st.exec.usuario !== s.id) return trocar('#/treino');
  const e = st.exec, min = Math.min(300, Math.max(1, Math.round((Date.now() - e.inicio) / 60000)));
  let cansaco = null;
  pagina(`<div class="topo"><p class="ola">Treino de ${esc(e.dia.toLowerCase())}</p></div>
    <h1 class="display fim">Feito.</h1>
    <p class="sub" style="margin-bottom:28px;font-size:16px">${plural(e.treino.exercicios.length, 'exercício concluído', 'exercícios concluídos')}. Conte como foi para a sua personal.</p>
    <label class="campo"><span>Tempo de treino, em minutos</span><input type="number" id="tMin" min="1" max="300" value="${min}" inputmode="numeric"></label>
    <div class="campo"><span id="lCans">Quão cansado(a) você terminou?</span>
      <div class="escala" role="radiogroup" aria-labelledby="lCans">${NIVEIS.map((r, i) => `<button role="radio" aria-checked="false" data-v="${i + 1}"><b>${i + 1}</b><small>${r}</small></button>`).join('')}</div></div>
    <label class="campo"><span>Comentário (opcional)</span><textarea id="coment" rows="3" placeholder="Ex.: senti o joelho no afundo, a prancha ficou fácil"></textarea></label>
    <p class="erro" id="eFim" role="alert"></p>
    <button class="btn btn-ouro largo" id="salvarFim">Salvar treino</button>
    <p style="text-align:center;margin-top:8px"><button class="link" id="voltarExec">Voltar ao último exercício</button></p>`, {nav:false});
  onAll('.escala button','click',(ev, el) => { cansaco = +el.dataset.v; document.querySelectorAll('.escala button').forEach(b => b.setAttribute('aria-checked', b === el)); });
  on('#voltarExec','click',() => ir('#/treino/executar'));
  on('#salvarFim','click', async ev => {
    if (!cansaco) return msgErro('eFim', new Error('Escolha o nível de cansaço de 1 a 5.'));
    const b = ev.currentTarget; ocupado(b, 'Salvando…');
    try {
      await api('registrar_conclusao', {dia:e.dia, id_treino:e.treino.id_treino, exercicios:e.treino.exercicios.map(x => x.nome),
        tempo_min:document.getElementById('tMin').value, cansaco, comentario:document.getElementById('coment').value});
      execSalvo.limpar(); st.exec = null; toast('Treino salvo'); ir('#/treino');
    } catch(err){ msgErro('eFim', err); livre(b); }
  });
}

async function telaEvolucaoAluno(){
  pagina(`<h1 class="display titulo">Evolução</h1><div id="evo"><p class="sub">Carregando…</p></div>`);
  const el = document.getElementById('evo');
  try { const d = await api('evolucao'); if (el.isConnected) montarEvolucao(el, d, null); }
  catch(e){ if (!e.sessao) el.innerHTML = `<p class="erro">${esc(e.message)}</p>`; }
}
function montarEvolucao(el, d, idAluno){
  el.innerHTML = htmlEvolucao(d);
  onAll('[data-registrar]','click',() => modalMedidas(el, idAluno), el);
  onAll('[data-apagar]','click', async (e, b) => {
    if (!confirm('Apagar este registro?')) return;
    ocupado(b, '…');
    try { montarEvolucao(el, await api('excluir_medida', {id:b.dataset.apagar}), idAluno); toast('Registro apagado'); }
    catch(err){ if (!err.sessao) toast(err.message); livre(b); }
  }, el);
}
function htmlEvolucao(d){
  const regs = d.registros, pesos = regs.filter(r => r.peso != null);
  const atual = pesos[pesos.length - 1], inicial = pesos[0];
  const meta = d.perfil && d.perfil.meta, alt = d.perfil && d.perfil.altura;
  let topo = '';
  if (atual){
    let variacao = '';
    if (pesos.length > 1){
      const dif = Math.round((atual.peso - inicial.peso) * 10) / 10;
      const rumoMeta = meta && Math.abs(atual.peso - meta) < Math.abs(inicial.peso - meta);
      const txt = dif === 0 ? 'Mesmo peso' : `${fmtNum(Math.abs(dif))} kg ${dif < 0 ? 'a menos' : 'a mais'}`;
      variacao = `<p class="peso-var">${rumoMeta ? `<b>${txt}</b>` : txt} desde ${fmtLonga(inicial.data)}</p>`;
    } else variacao = `<p class="peso-var">Registrado ${fmtData(atual.data).toLowerCase()}. Registre de novo daqui a uma semana para ver a evolução.</p>`;
    let metaHtml = '';
    if (meta && inicial && inicial.peso !== meta){
      const pct = Math.max(0, Math.min(1, (inicial.peso - atual.peso) / (inicial.peso - meta)));
      const falta = Math.round(Math.abs(atual.peso - meta) * 10) / 10;
      metaHtml = `<div class="meta"><div class="meta-barra" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(pct * 100)}" aria-label="Progresso até a meta"><i style="width:${pct * 100}%"></i></div>
        <p class="sub">${pct >= 1 || falta === 0 ? `Meta de ${fmtNum(meta)} kg alcançada.` : `Faltam ${fmtNum(falta)} kg para a meta de ${fmtNum(meta)} kg (${Math.round(pct * 100)}% do caminho).`}</p></div>`;
    }
    let imc = '';
    if (alt){
      const v = atual.peso / Math.pow(alt / 100, 2);
      const faixa = v < 18.5 ? 'abaixo do peso' : v < 25 ? 'peso adequado' : v < 30 ? 'sobrepeso' : 'obesidade';
      imc = `<p class="sub" style="margin-top:10px">IMC ${fmtNum(v)}, faixa de ${faixa}. O IMC é só uma referência e não considera massa muscular.</p>`;
    }
    topo = `<div class="peso-hero"><span class="display peso-num">${fmtNum(atual.peso)}</span><span class="peso-kg">kg</span></div>${variacao}${metaHtml}${imc}`;
  } else {
    topo = `<div class="vazio"><p>Registre seu peso e suas medidas para acompanhar a evolução ao longo das semanas.</p></div>`;
  }
  const medidasComDado = MEDIDAS.filter(([k]) => regs.some(r => r[k] != null));
  const tabela = medidasComDado.length ? `<section class="bloco"><h2>Medidas</h2><table class="tabela"><thead><tr><th>Medida</th><th>Início</th><th>Atual</th><th>Diferença</th></tr></thead><tbody>
    ${medidasComDado.map(([k, rot, un]) => {
      const vals = regs.filter(r => r[k] != null), a = vals[0][k], b = vals[vals.length - 1][k], dif = Math.round((b - a) * 10) / 10;
      return `<tr><td>${rot}</td><td>${fmtNum(a)} ${un}</td><td>${fmtNum(b)} ${un}</td><td>${vals.length > 1 ? (dif > 0 ? '+' : dif < 0 ? '−' : '') + fmtNum(Math.abs(dif)) + ' ' + un : '–'}</td></tr>`;
    }).join('')}</tbody></table></section>` : '';
  const f = d.frequencia;
  return `${topo}
    <button class="btn btn-ouro largo" data-registrar style="margin-top:22px">Registrar peso e medidas</button>
    ${pesos.length > 1 ? `<section class="bloco"><h2>Peso ao longo do tempo</h2>${graficoPeso(pesos, meta)}</section>` : ''}
    ${tabela}
    <section class="bloco"><h2>Frequência nas últimas 8 semanas</h2>${graficoSemanas(f.semanas)}
      <div class="stats" style="margin-top:14px"><div><b>${f.sequencia}</b><span>${f.sequencia === 1 ? 'semana seguida' : 'semanas seguidas'} treinando</span></div><div><b>${f.total}</b><span>${f.total === 1 ? 'treino registrado' : 'treinos registrados'} no total</span></div></div></section>
    ${d.historico && d.historico.length ? `<section class="bloco"><h2>Treinos recentes</h2>${listaHist(d.historico.slice(0, 5))}</section>` : ''}
    ${regs.length ? `<section class="bloco"><h2>Registros</h2>${regs.slice().reverse().map(r => `<div class="medida"><div>
        <b>${fmtLonga(r.data)}</b>
        <p>${[r.peso != null ? fmtNum(r.peso) + ' kg' : '', ...MEDIDAS.filter(([k]) => r[k] != null).map(([k, rot, un]) => `${rot.toLowerCase()} ${fmtNum(r[k])} ${un}`)].filter(Boolean).join(', ')}</p>
        ${r.observacao ? `<p class="sub">${esc(r.observacao)}</p>` : ''}</div>
        <button class="ic-btn rm" data-apagar="${esc(r.id)}" aria-label="Apagar registro de ${fmtLonga(r.data)}">${ICON.x}</button></div>`).join('')}</section>` : ''}`;
}
function graficoPeso(pts, meta){
  const W = 340, H = 180, L = 34, R = 10, T = 12, B = 26;
  const xs = pts.map(r => new Date(r.data).getTime()), ys = pts.map(r => r.peso).concat(meta ? [meta] : []);
  let min = Math.min(...ys), max = Math.max(...ys);
  if (max - min < 2){ min -= 1; max += 1; }
  const pad = (max - min) * .12; min -= pad; max += pad;
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const X = t => L + (x1 === x0 ? .5 : (t - x0) / (x1 - x0)) * (W - L - R);
  const Y = v => T + (max - v) / (max - min) * (H - T - B);
  const linha = pts.map((r, i) => (i ? 'L' : 'M') + X(xs[i]).toFixed(1) + ' ' + Y(r.peso).toFixed(1)).join(' ');
  const ticks = [0, .5, 1].map(k => min + (max - min) * k);
  const ult = pts[pts.length - 1];
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Peso foi de ${fmtNum(pts[0].peso)} para ${fmtNum(ult.peso)} quilos">
    ${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="rgba(238,231,215,.08)"/><text x="${L - 6}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end">${fmtNum(v, 0)}</text>`).join('')}
    ${meta ? `<line x1="${L}" x2="${W - R}" y1="${Y(meta).toFixed(1)}" y2="${Y(meta).toFixed(1)}" stroke="#D9A441" stroke-dasharray="4 4" opacity=".6"/><text x="${W - R}" y="${(Y(meta) - 5).toFixed(1)}" text-anchor="end" style="fill:#D9A441">meta ${fmtNum(meta)}</text>` : ''}
    <path d="${linha}" fill="none" stroke="#EEE7D7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((r, i) => `<circle cx="${X(xs[i]).toFixed(1)}" cy="${Y(r.peso).toFixed(1)}" r="${i === pts.length - 1 ? 4.5 : 3}" fill="${i === pts.length - 1 ? '#D9A441' : '#EEE7D7'}"/>`).join('')}
    <text x="${L}" y="${H - 6}">${new Date(x0).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'})}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${new Date(x1).toLocaleDateString('pt-BR', {day:'2-digit', month:'short'})}</text>
  </svg>`;
}
function graficoSemanas(sem){
  const W = 340, H = 120, T = 16, B = 22, max = Math.max(4, ...sem.map(s => s.total)), bw = (W - 8 * 6) / 8;
  return `<svg class="grafico" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dias treinados por semana: ${sem.map(s => s.total).join(', ')}">
    ${sem.map((s, i) => {
      const h = s.total ? Math.max(4, (s.total / max) * (H - T - B)) : 2, x = i * (bw + 6), y = H - B - h, atual = i === sem.length - 1;
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${atual ? '#D9A441' : s.total ? '#8E98B3' : 'rgba(238,231,215,.12)'}"/>
        ${s.total ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" style="fill:#EEE7D7">${s.total}</text>` : ''}
        <text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${atual ? 'agora' : new Date(s.inicio).toLocaleDateString('pt-BR', {day:'2-digit', month:'2-digit'})}</text>`;
    }).join('')}</svg>`;
}
function modalMedidas(el, idAluno){
  const m = modal(`${modalCab('Registrar medidas', 'Cancelar')}<form class="modal-corpo" id="fMed">
    <label class="campo"><span>Data</span><input type="date" name="data" value="${hojeIso()}" max="${hojeIso()}"></label>
    <label class="campo"><span>Peso (kg)</span><input name="peso" inputmode="decimal" placeholder="72,5"><small>Pese-se no mesmo horário, de preferência de manhã e em jejum.</small></label>
    <div class="duas">${MEDIDAS.map(([k, rot, un]) => `<label class="campo"><span>${rot} (${un})</span><input name="${k}" inputmode="decimal"></label>`).join('')}</div>
    <label class="campo"><span>Observação (opcional)</span><input name="observacao" placeholder="Ex.: avaliação com adipômetro"></label>
    <p class="erro" id="eMed" role="alert"></p>
    <button class="btn btn-ouro largo" type="submit">Salvar registro</button></form>`, {rotulo:'Registrar medidas'});
  on('#fMed','submit', async e => {
    e.preventDefault();
    const f = e.target, b = f.querySelector('button[type=submit]');
    const dados = {id_usuario:idAluno || undefined, data:f.data.value, peso:lerNum(f.peso.value), observacao:f.observacao.value};
    MEDIDAS.forEach(([k]) => dados[k] = lerNum(f[k].value));
    ocupado(b, 'Salvando…');
    try { const d = await api('registrar_medidas', dados); m.fechar(); montarEvolucao(el, d, idAluno); toast('Registro salvo'); }
    catch(err){ msgErro('eMed', err); livre(b); }
  }, m.el);
}

/* =========================================================
   CHAT
   ========================================================= */
async function telaChat(idAluno){
  const s = sessao.get(), ehAluno = !idAluno, comNav = ehAluno;
  pagina(`<header class="chat-cab">${idAluno ? voltarHtml(`#/alunos/${idAluno}/treino`, 'Voltar') : ''}<div class="quem" id="chatQuem"><b>Recados</b><span>Carregando…</span></div></header>
    <div class="chat-lista" id="chatLista" aria-live="polite"></div>
    <div class="chat-rodape" id="chatRodape" hidden><div>
      <div class="rapidas">${(ehAluno ? RAPIDAS_ALUNO : RAPIDAS_PERSONAL).map(t => `<button class="chip" data-rapida="${esc(t)}">${esc(t)}</button>`).join('')}</div>
      <form class="enviar" id="fMsg"><label class="sr-only" for="txtMsg">Mensagem</label>
        <textarea id="txtMsg" rows="1" placeholder="Escreva uma mensagem" enterkeyhint="send"></textarea>
        <button class="btn-enviar" type="submit" aria-label="Enviar">${ICON.enviar}</button></form></div></div>`, {nav:comNav, classe:'chat-tela' + (comNav ? '' : ' sem-nav')});
  const lista = document.getElementById('chatLista'), quem = document.getElementById('chatQuem');
  const rodape = document.getElementById('chatRodape'), tx = document.getElementById('txtMsg');
  let dados = null, assinatura = '';

  const pertoDoFim = () => window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
  const rolarFim = () => window.scrollTo(0, document.body.scrollHeight);
  function desenhar(forcarFim){
    const fim = forcarFim || pertoDoFim();
    const msgs = dados.mensagens;
    if (!msgs.length){ lista.innerHTML = `<div class="vazio" style="text-align:center">${ehAluno ? 'Tire dúvidas, conte como foi o treino ou avise se sentir alguma dor.' : 'Nenhuma mensagem ainda. Mande uma dica ou pergunte como foi o treino.'}</div>`; return; }
    let html = '', diaAnt = '', autorAnt = '';
    msgs.forEach((m, i) => {
      const dia = new Date(m.data).toDateString();
      if (dia !== diaAnt){ const f = fmtData(m.data); html += `<div class="dia-sep">${f === 'Hoje' || f === 'Ontem' ? f : fmtLonga(m.data)}</div>`; autorAnt = ''; }
      const minha = m.autor === s.id;
      const mostrarAutor = !minha && !ehAluno && m.autor !== idAluno && m.autor_nome && autorAnt !== m.autor;
      html += `<div class="msg ${minha ? 'minha' : ''} ${autorAnt === m.autor ? 'seguida' : ''} ${m.enviando ? 'enviando' : ''}">${mostrarAutor ? `<span class="autor">${esc(m.autor_nome)}</span>` : ''}${esc(m.texto)}<time>${m.enviando ? 'enviando…' : fmtHoraCurta(m.data)}</time></div>`;
      diaAnt = dia; autorAnt = m.autor;
    });
    const ultMinha = [...msgs].reverse().find(m => m.autor === s.id && !m.enviando);
    if (ultMinha && ultMinha === msgs[msgs.length - 1] && ultMinha.lida) html += '<span class="lida">Lida</span>';
    lista.innerHTML = html;
    if (fim) rolarFim();
  }
  function cabecalho(){
    if (ehAluno){
      const p = dados.personal;
      quem.outerHTML = p ? `<button class="quem" id="chatQuem" style="display:flex;gap:10px;align-items:center;text-align:left">${avatar(p.foto, p.nome)}<span><b>${esc(p.nome)}</b><span>Sua personal. Toque para ver o perfil</span></span></button>`
        : `<div class="quem" id="chatQuem"><b>Recados</b></div>`;
      on('#chatQuem','click',() => { if (p) modal(`${modalCab('Sua personal')}<div class="modal-corpo">${cardPersonal(p)}</div>`); });
    } else {
      quem.outerHTML = `<div class="quem" id="chatQuem" style="display:flex;gap:10px;align-items:center">${avatar('', dados.aluno.nome)}<span><b>${esc(dados.aluno.nome)}</b><span>${dados.personal ? 'Acompanhado(a) por ' + esc(dados.personal.nome) : 'Sem personal definida'}</span></span></div>`;
    }
  }
  async function carregar(inicial){
    try {
      const d = await api('obter_mensagens', idAluno ? {id_usuario:idAluno} : {});
      const nova = d.mensagens.map(m => m.id + (m.lida ? 'l' : '')).join();
      if (!lista.isConnected) return;
      if (inicial){
        dados = d; cabecalho();
        if (ehAluno && !d.personal){
          lista.innerHTML = `<div class="vazio">Escolha uma personal para poder conversar sobre seus treinos.<br><a class="btn btn-ouro" href="#/personais">Escolher personal</a></div>`;
          return;
        }
        rodape.hidden = false;
        desenhar(true);
      } else if (nova !== assinatura){ dados.mensagens = d.mensagens; desenhar(false); }
      assinatura = nova;
      if (ehAluno){ if (st.naoLidas){ st.naoLidas = 0; if (st.aluno) st.aluno.nao_lidas = 0; atualizarNav(); } }
      else if (st.dash){ const a = st.dash.alunos.find(x => x.id === idAluno); if (a && a.nao_lidas){ a.nao_lidas = 0; st.naoLidas = st.dash.alunos.reduce((t, x) => t + (x.nao_lidas || 0), 0); } }
    } catch(e){ if (inicial && !e.sessao) lista.innerHTML = `<p class="erro">${esc(e.message)}</p>`; }
  }
  await carregar(true);
  st.intervalos.push(setInterval(() => { if (!document.hidden) carregar(false); }, 10000));

  const crescer = () => { tx.style.height = 'auto'; tx.style.height = Math.min(140, tx.scrollHeight) + 'px'; };
  tx.addEventListener('input', crescer);
  tx.addEventListener('focus', () => { document.body.classList.add('digitando'); setTimeout(rolarFim, 300); });
  tx.addEventListener('blur', () => setTimeout(() => document.body.classList.remove('digitando'), 150));
  tx.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && matchMedia('(pointer:fine)').matches){ e.preventDefault(); enviar(); } });
  onAll('[data-rapida]','click',(e, b) => { tx.value = b.dataset.rapida; crescer(); tx.focus(); });
  on('#fMsg','submit', e => { e.preventDefault(); enviar(); });

  async function enviar(){
    const texto = tx.value.trim();
    if (!texto || !dados) return;
    tx.value = ''; crescer();
    const temp = {id:'tmp' + Date.now(), texto, autor:s.id, data:new Date().toISOString(), enviando:true};
    dados.mensagens.push(temp); desenhar(true);
    try {
      const d = await api('enviar_mensagem', idAluno ? {id_usuario:idAluno, mensagem:texto} : {mensagem:texto});
      if (!lista.isConnected) return;
      dados.mensagens = d.mensagens; assinatura = d.mensagens.map(m => m.id + (m.lida ? 'l' : '')).join(); desenhar(true);
    } catch(err){
      dados.mensagens = dados.mensagens.filter(m => m !== temp); desenhar(false);
      if (!err.sessao){ tx.value = texto; crescer(); toast(err.message); }
    }
  }
}

/* =========================================================
   PERSONAIS E PERFIL
   ========================================================= */
async function telaPersonais(){
  pagina(`${voltarHtml('#/perfil', 'Perfil')}<h1 class="display titulo">Personais</h1>
    <p class="sub" style="margin-bottom:22px">Escolha quem vai acompanhar seus treinos, ajustar sua série e responder seus recados.</p><div id="lista"><p class="sub">Carregando…</p></div>`);
  const el = document.getElementById('lista');
  try {
    const [lista, eu] = await Promise.all([api('listar_personais'), api('meu_perfil')]);
    const atual = eu.perfil_aluno ? eu.perfil_aluno.id_personal : '';
    if (!el.isConnected) return;
    el.innerHTML = (lista.length ? lista.map(p => cardPersonal(p, {sel:p.id === atual,
      acoes:`<div class="linha-btns">${p.id === atual ? '<span class="btn btn-linha btn-p desativado">Sua personal</span>' : `<button class="btn btn-ouro btn-p" data-escolher="${esc(p.id)}">Escolher ${esc(p.nome.split(' ')[0])}</button>`}</div>`})).join('')
      : '<p class="vazio">Nenhuma personal disponível no momento.</p>')
      + (atual ? '<p style="text-align:center;margin-top:10px"><button class="link" data-escolher="">Ficar sem personal</button></p>' : '');
    onAll('[data-escolher]','click', async (e, b) => {

async function carregarDash(){
  st.dash = await api('dashboard_personal');
  const eu = sessao.get();
  st.naoLidas = st.dash.alunos.filter(a => a.meu || eu.tipo !== 'Personal').reduce((t, a) => t + (a.nao_lidas || 0), 0);
  return st.dash;
}
async function telaAlunos(){
  const s = sessao.get();
  if (!st.dash) carregando('Carregando alunos…');
  else renderAlunos();
  try { const antes = JSON.stringify(st.dash); await carregarDash(); if (location.hash === '#/alunos' && JSON.stringify(st.dash) !== antes) renderAlunos(); }
  catch(e){ if (!st.dash) erroTela(e, telaAlunos); else if (!e.sessao) toast(e.message); }
}
function cardAluno(a){
  const st7 = a.stats;
  const peso = st7.peso_variacao != null ? `${st7.peso_variacao > 0 ? '+' : st7.peso_variacao < 0 ? '−' : ''}${fmtNum(Math.abs(st7.peso_variacao))}` : (st7.peso_atual != null ? fmtNum(st7.peso_atual) : '–');
  return `<article class="aluno">
    <div class="aluno-topo"><h2><a href="#/alunos/${esc(a.id)}/treino">${esc(a.nome)}</a></h2>
      <a class="btn btn-linha btn-p" href="#/alunos/${esc(a.id)}/chat">Recados${a.nao_lidas ? `<span class="badge-inline">${a.nao_lidas}</span>` : ''}</a></div>
    <p class="perfil">${a.perfil ? esc(perfilTxt(a.perfil)) : 'Ainda não respondeu o questionário.'}${!a.meu ? (a.personal_nome ? `. Personal: ${esc(a.personal_nome)}` : '. Sem personal') : ''}</p>
    <div class="numeros">
      <div><b>${st7.treinos_7d}</b><span>dias treinados na semana</span></div>
      <div><b>${peso}</b><span>${st7.peso_variacao != null ? 'kg desde o início' : 'kg, peso atual'}</span></div>
      <div><b class="menor">${st7.ultimo ? fmtData(st7.ultimo) : '–'}</b><span>último treino${st7.cansaco_medio != null ? `, cansaço ${String(st7.cansaco_medio).replace('.', ',')}` : ''}</span></div>
    </div>
    <a class="btn btn-linha largo" href="#/alunos/${esc(a.id)}/treino">Ver treino e evolução</a></article>`;
}
function renderAlunos(){
  const s = sessao.get(), d = st.dash;
  const meus = d.alunos.filter(a => a.meu), outros = d.alunos.filter(a => !a.meu);
  pagina(`<h1 class="display titulo">Alunos</h1>
    ${!d.alunos.length ? `<p class="vazio">${s.tipo === 'Personal' ? 'Nenhum aluno escolheu você ainda. Complete seu perfil com foto e descrição para aparecer bem na lista de personais.' : 'Nenhum aluno cadastrado.'}${s.tipo === 'Personal' ? '<br><a class="btn btn-ouro" href="#/perfil">Completar meu perfil</a>' : ''}</p>` : ''}
    ${meus.map(cardAluno).join('')}
    ${outros.length ? `<h2 class="grupo-titulo">${s.tipo === 'Personal' ? 'Outros alunos (você vê como administrador)' : 'Todos os alunos'}</h2>${outros.map(cardAluno).join('')}` : ''}
    <p style="text-align:center;margin-top:24px"><button class="link" id="atualizar">Atualizar dados</button></p>`);
  on('#atualizar','click',() => { st.dash = null; telaAlunos(); });
}
function perfilTxt(p){ return [p.objetivo, p.local === 'Casa' ? 'treina em casa' : p.local === 'Academia' ? 'treina na academia' : '', p.tempo ? p.tempo + ' min por dia' : ''].filter(Boolean).join(', '); }

const alunoAtual = () => st.dash && st.det && st.dash.alunos.find(x => x.id === st.det.id);
function rascunho(dia){
  const det = st.det;
  if (!det.rascunho[dia]){
    const t = alunoAtual().treinos[dia];
    det.rascunho[dia] = t ? t.exercicios.map(x => ({id:x.id, nome:x.nome, foco:x.foco, imagem:x.imagem, series:x.series, reps:x.reps})) : [];
  }
  return det.rascunho[dia];
}
const algumSujo = () => st.det && Object.values(st.det.sujo).some(Boolean);
async function telaAlunoDetalhe(id, aba){
  if (!st.dash || !st.dash.alunos.some(a => a.id === id)){
    carregando('Carregando aluno…');
    try { await carregarDash(); } catch(e){ return erroTela(e, () => telaAlunoDetalhe(id, aba)); }
    if (!st.dash.alunos.some(a => a.id === id)){ toast('Aluno não encontrado.'); return trocar('#/alunos'); }
  }
  if (!st.det || st.det.id !== id) st.det = {id, dia:diaHoje(), rascunho:{}, sujo:{}};
  st.guarda = h => h.startsWith(`#/alunos/${id}`) || !algumSujo() || confirm('Há alterações no treino que não foram salvas. Sair mesmo assim?');
  const a = alunoAtual();
  pagina(`${voltarHtml('#/alunos', 'Alunos')}
    <div class="cab-aluno"><h1 class="display titulo" style="margin:0">${esc(a.nome)}</h1>
      <a class="btn btn-linha btn-p" href="#/alunos/${esc(id)}/chat">Recados${a.nao_lidas ? `<span class="badge-inline">${a.nao_lidas}</span>` : ''}</a></div>
    <p class="sub" style="margin-top:8px">${a.perfil ? esc(perfilTxt(a.perfil)) : 'Questionário pendente'}${!a.meu && a.personal_nome ? `. Personal: ${esc(a.personal_nome)}` : ''}</p>
    <nav class="abas" aria-label="Seções do aluno">${[['treino','Treino'],['evolucao','Evolução'],['historico','Histórico']].map(([k, l]) =>
      `<a class="aba ${aba === k ? 'ativa' : ''}" href="#/alunos/${esc(id)}/${k}" data-aba="${k}" ${aba === k ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>
    <div id="conteudo"></div>`);
  onAll('[data-aba]','click',(e, el) => { e.preventDefault(); trocar(el.getAttribute('href')); });
  const c = document.getElementById('conteudo');
  if (aba === 'treino') renderEditor(c);
  else if (aba === 'historico') c.innerHTML = listaHist(a.historico);
  else {
    c.innerHTML = '<p class="sub">Carregando evolução…</p>';
    try { const d = await api('evolucao', {id_usuario:id}); if (c.isConnected) montarEvolucao(c, d, id); }
    catch(e){ if (!e.sessao && c.isConnected) c.innerHTML = `<p class="erro">${esc(e.message)}</p>`; }
  }
}
function renderEditor(c){
  const det = st.det, a = alunoAtual(), lista = rascunho(det.dia);
  const tem = dd => (det.rascunho[dd] ? det.rascunho[dd].length : (a.treinos[dd] ? a.treinos[dd].exercicios.length : 0)) > 0;
  st.sujo = algumSujo();
  c.innerHTML = `<div class="chips" aria-label="Dia da semana">${DIAS.map(dd =>
      `<button class="chip ${tem(dd) ? 'tem' : ''} ${det.sujo[dd] ? 'sujo' : ''}" data-dia="${dd}" aria-pressed="${dd === det.dia}">${CURTO[dd]}</button>`).join('')}</div>
    <div class="editor-topo"><h2 class="rot2">${esc(det.dia)}<span class="pend" id="pend">${det.sujo[det.dia] ? 'não salvo' : ''}</span></h2>
      ${DIAS.some(dd => dd !== det.dia && tem(dd)) ? `<select id="copiar" aria-label="Copiar treino de outro dia"><option value="">Copiar de…</option>${DIAS.filter(dd => dd !== det.dia && tem(dd)).map(dd => `<option>${dd}</option>`).join('')}</select>` : ''}</div>
    ${lista.length ? lista.map((x, i) => `<div class="edit-ex">
        <div class="edit-info"><span class="n">${i + 1}</span><div><div class="nome">${esc(x.nome)}</div><div class="foco">${esc(x.foco)}</div></div></div>
        <div class="edit-ctrl">
          <label>Séries<input data-i="${i}" data-campo="series" value="${esc(x.series)}" inputmode="numeric"></label>
          <label>Repetições<input data-i="${i}" data-campo="reps" value="${esc(x.reps)}"></label>
          <div class="mover"><button class="ic-btn" data-mover="${i}" data-dir="-1" aria-label="Subir ${esc(x.nome)}" ${i === 0 ? 'disabled' : ''}>${ICON.cima}</button><button class="ic-btn" data-mover="${i}" data-dir="1" aria-label="Descer ${esc(x.nome)}" ${i === lista.length - 1 ? 'disabled' : ''}>${ICON.baixo}</button></div>
          <button class="ic-btn rm" data-rm="${i}" aria-label="Remover ${esc(x.nome)}">${ICON.x}</button>
        </div></div>`).join('')
      : '<p class="sub" style="margin:8px 0 4px">Dia de descanso. Adicione exercícios para montar um treino neste dia.</p>'}
    <button class="btn btn-linha largo" id="add" style="margin-top:16px">Adicionar exercício da biblioteca</button>
    <div class="acoes-edit">
      <button class="btn btn-ouro largo" id="salvarTreino" ${det.sujo[det.dia] ? '' : 'disabled'}>Salvar treino de ${esc(det.dia.toLowerCase())}</button>
      ${lista.length ? '<button class="link" id="descansoDia">Transformar em dia de descanso</button>' : ''}
    </div>`;
  const marcar = () => { det.sujo[det.dia] = true; st.sujo = true; document.getElementById('salvarTreino').disabled = false; document.getElementById('pend').textContent = 'não salvo'; };
  const mudou = () => { det.sujo[det.dia] = true; renderEditor(c); };
  onAll('[data-dia]','click',(e, el) => { det.dia = el.dataset.dia; renderEditor(c); }, c);
  onAll('.edit-ctrl input','input',(e, el) => { lista[+el.dataset.i][el.dataset.campo] = el.value; marcar(); }, c);
  onAll('[data-rm]','click',(e, el) => { lista.splice(+el.dataset.rm, 1); mudou(); }, c);
  onAll('[data-mover]','click',(e, el) => { const i = +el.dataset.mover, j = i + +el.dataset.dir; [lista[i], lista[j]] = [lista[j], lista[i]]; mudou(); }, c);
  on('#copiar','change', e => {
    const src = e.target.value; if (!src) return;
    if (lista.length && !confirm(`Substituir o treino de ${det.dia.toLowerCase()} pelo de ${src.toLowerCase()}?`)){ e.target.value = ''; return; }
    det.rascunho[det.dia] = rascunho(src).map(x => Object.assign({}, x)); mudou();
  }, c);
  on('#descansoDia','click',() => { det.rascunho[det.dia] = []; mudou(); }, c);
  on('#add','click',() => modalBiblioteca(c), c);
  on('#salvarTreino','click', async e => {
    const b = e.currentTarget, dia = det.dia; ocupado(b, 'Salvando…');
    try {
      const r = await api('atualizar_treino', {id_usuario:det.id, dia, exercicios:rascunho(dia).map(x => ({id:x.id, series:x.series, reps:x.reps}))});
      if (r.treino) a.treinos[dia] = r.treino; else delete a.treinos[dia];
      det.rascunho[dia] = null; det.sujo[dia] = false;
      toast(`Treino de ${dia.toLowerCase()} salvo`);
      if (c.isConnected) renderEditor(c);
    } catch(err){ if (!err.sessao) toast(err.message); livre(b); }
  }, c);
}
async function modalBiblioteca(c){
  if (!st.lib){
    toast('Carregando a biblioteca…');
