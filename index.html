  }
  const f = {q:'', local:'Todos', foco:'Todos'};
  const focos = ['Todos', ...new Set(st.lib.map(e => e.foco).filter(Boolean))];
  const m = modal(`<div class="modal-cab">
      <div class="modal-linha"><h2>Biblioteca, ${esc(st.det.dia.toLowerCase())}</h2><button class="link" data-fechar>Concluir</button></div>
      <label class="sr-only" for="busca">Buscar exercício</label><input type="search" id="busca" placeholder="Buscar por nome">
      <div class="busca-linha" style="grid-template-columns:1fr 1fr"><select id="fLocal" aria-label="Local"><option value="Todos">Qualquer local</option><option>Casa</option><option>Academia</option></select>
      <select id="fFoco" aria-label="Grupo muscular">${focos.map(x => `<option value="${esc(x)}">${x === 'Todos' ? 'Todos os grupos' : esc(x)}</option>`).join('')}</select></div>
    </div><div class="modal-corpo" id="libLista" style="padding-top:4px"></div>`, {rotulo:'Biblioteca de exercícios', aoFechar:() => { if (c.isConnected && st.det) renderEditor(c); }});
  const listaEl = m.el.querySelector('#libLista');
  const desenhar = () => {
    const doDia = rascunho(st.det.dia), ids = new Set(doDia.map(x => x.id)), q = f.q.toLowerCase();
    const itens = st.lib.filter(e => (!q || e.nome.toLowerCase().includes(q)) && (f.local === 'Todos' || e.local === f.local || e.local === 'Ambos') && (f.foco === 'Todos' || e.foco === f.foco));
    listaEl.innerHTML = itens.length ? itens.map(e => `<div class="lib-ex">
        <span class="thumb">${esc(e.foco)}${htmlImg(e.imagem, e.nome, '', 200)}</span>
        <div class="info"><div class="nome">${esc(e.nome)}</div><div class="foco">${e.local === 'Ambos' ? 'Casa ou academia' : esc(e.local)}${e.video ? ', com vídeo' : ''}</div></div>
        <button class="btn btn-p ${ids.has(e.id) ? 'btn-linha' : 'btn-ouro'}" data-add="${esc(e.id)}" ${ids.has(e.id) ? 'disabled' : ''}>${ids.has(e.id) ? 'No treino' : 'Adicionar'}</button></div>`).join('')
      : '<p class="sub" style="padding:18px 0">Nenhum exercício com esses filtros. Você pode cadastrar novos na aba Exercícios.</p>';
    onAll('[data-add]','click',(ev, el) => {
      const e = st.lib.find(x => x.id === el.dataset.add), ref = doDia[doDia.length - 1];
      doDia.push({id:e.id, nome:e.nome, foco:e.foco, imagem:e.imagem, series:ref ? ref.series : '3', reps:ref ? ref.reps : '12'});
      st.det.sujo[st.det.dia] = true; st.sujo = true; toast(`${e.nome} adicionado`); desenhar();
    }, listaEl);
  };
  m.el.querySelector('#busca').addEventListener('input', ev => { f.q = ev.target.value; desenhar(); });
  m.el.querySelector('#fLocal').addEventListener('change', ev => { f.local = ev.target.value; desenhar(); });
  m.el.querySelector('#fFoco').addEventListener('change', ev => { f.foco = ev.target.value; desenhar(); });
  desenhar();
}

/* =========================================================
   EXERCÍCIOS (gestão: personal e admin)
   ========================================================= */
async function telaExercicios(){
  const f = st.filtroEx = st.filtroEx || {q:'', foco:'Todos', arquivados:false};
  pagina(`<div class="cab-aluno"><h1 class="display titulo" style="margin:0">Exercícios</h1><a class="btn btn-ouro btn-p" href="#/exercicios/novo">Novo</a></div>
    <div class="busca-linha"><input type="search" id="bEx" placeholder="Buscar por nome" value="${esc(f.q)}" aria-label="Buscar exercício">
      <select id="fEx" aria-label="Grupo muscular"><option value="Todos">Todos</option>${FOCOS.map(x => `<option ${f.foco === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <label class="check" style="margin:10px 0 6px"><input type="checkbox" id="arqEx" ${f.arquivados ? 'checked' : ''}><span>Mostrar arquivados</span></label>
    <div id="listaEx"><p class="sub">Carregando…</p></div>`);
  const el = document.getElementById('listaEx');
  const desenhar = () => {
    const q = f.q.toLowerCase();
    const itens = st.exs.filter(e => (f.arquivados || e.ativo) && (!q || e.nome.toLowerCase().includes(q)) && (f.foco === 'Todos' || e.foco === f.foco));
    const semMidia = st.exs.filter(e => e.ativo && !e.imagem && !e.video).length;
    el.innerHTML = (semMidia ? `<p class="sub" style="margin-bottom:6px">${plural(semMidia, 'exercício ativo ainda está', 'exercícios ativos ainda estão')} sem foto ou vídeo.</p>` : '')
      + (itens.length ? itens.map(e => `<a class="ex-row" href="#/exercicios/${esc(e.id)}">
        <span class="thumb">${esc(e.foco)}${htmlImg(e.imagem, e.nome, '', 200)}</span>
        <span class="info"><span class="nome" style="display:block">${esc(e.nome)}</span>
          <span class="foco">${esc(e.foco)}, ${e.local === 'Ambos' ? 'casa ou academia' : esc(e.local.toLowerCase())}</span><br>
          ${e.video ? '<span class="selo ouro">vídeo</span>' : ''}${e.imagem ? '<span class="selo">foto</span>' : ''}${!e.ativo ? '<span class="selo coral">arquivado</span>' : ''}</span></a>`).join('')
      : '<p class="vazio">Nenhum exercício encontrado.</p>');
  };
  on('#bEx','input', e => { f.q = e.target.value; if (st.exs) desenhar(); });
  on('#fEx','change', e => { f.foco = e.target.value; if (st.exs) desenhar(); });
  on('#arqEx','change', e => { f.arquivados = e.target.checked; if (st.exs) desenhar(); });
  try { if (!st.exs) st.exs = await api('listar_exercicios', {todos:true}); if (el.isConnected) desenhar(); }
  catch(e){ if (!e.sessao) el.innerHTML = `<p class="erro">${esc(e.message)}</p>`; }
}
async function telaExercicioForm(id){
  const novo = id === 'novo';
  if (!novo && !st.exs){
    carregando('Carregando exercício…');
    try { st.exs = await api('listar_exercicios', {todos:true}); } catch(e){ return erroTela(e, () => telaExercicioForm(id)); }
  }
  const ex = novo ? null : st.exs.find(e => e.id === id);
  if (!novo && !ex){ toast('Exercício não encontrado.'); return trocar('#/exercicios'); }
  const f = ex ? Object.assign({}, ex) : {nome:'', descricao:'', local:'Ambos', foco:'', imagem:'', video:''};
  let sujo = false;
  st.guarda = () => st.enviando ? (alert('Espere o envio do arquivo terminar.'), false) : (!sujo || confirm('Sair sem salvar as alterações deste exercício?'));
  const marcar = () => { sujo = true; st.sujo = true; };
  const focos = [...new Set([...FOCOS, ...(st.exs || []).map(e => e.foco).filter(Boolean)])];

  function render(){
    const outroFoco = f.foco && !focos.includes(f.foco);
    pagina(`${voltarHtml('#/exercicios', 'Exercícios')}
      <h1 class="display titulo">${novo ? 'Novo exercício' : 'Editar'}</h1>
      <form id="fEx" novalidate style="margin-top:18px">
        <label class="campo"><span>Nome</span><input name="nome" value="${esc(f.nome)}" required></label>
        <label class="campo"><span>Como fazer</span><textarea name="descricao" rows="5" placeholder="Posição inicial, movimento e o que evitar.">${esc(f.descricao)}</textarea></label>
        <span class="rotulo">Onde dá para fazer</span>
        <div class="chips" style="margin:0 0 16px">${[['Casa','Em casa'],['Academia','Na academia'],['Ambos','Nos dois']].map(([v, l]) => `<button type="button" class="chip" data-local="${v}" aria-pressed="${f.local === v}">${l}</button>`).join('')}</div>
        <label class="campo"><span>Grupo muscular</span><select name="foco"><option value="">Escolha</option>${focos.map(x => `<option ${f.foco === x ? 'selected' : ''}>${esc(x)}</option>`).join('')}<option value="__outro" ${outroFoco ? 'selected' : ''}>Outro…</option></select></label>
        <label class="campo" id="campoOutro" ${outroFoco ? '' : 'hidden'}><span>Nome do grupo</span><input name="outro" value="${outroFoco ? esc(f.foco) : ''}"></label>

        <span class="rotulo">Foto de demonstração</span>
        <div class="upl">
          <div class="upl-prev">${imgSrc(f.imagem) ? htmlImg(f.imagem, f.nome, '', 1000) : '<div class="upl-vazio">Sem foto</div>'}</div>
          <div class="upl-acoes"><label class="btn btn-linha btn-p"><input type="file" accept="image/*" id="upImg" class="sr-only">${f.imagem ? 'Trocar foto' : 'Enviar foto'}</label>${f.imagem ? '<button type="button" class="btn btn-perigo btn-p" id="rmImg">Remover</button>' : ''}</div>
          <div id="progImg"></div>
          <label class="upl-link"><span class="sr-only">Link da imagem</span><input name="linkImg" placeholder="Ou cole um link (Imgur, Drive)" value="${/^https?:/i.test(f.imagem) ? esc(f.imagem) : ''}"></label>
        </div>

        <span class="rotulo">Vídeo de demonstração</span>
        <div class="upl">
          <div class="upl-prev">${f.video ? htmlVideo(f.video) : '<div class="upl-vazio">Sem vídeo</div>'}</div>
          <div class="upl-acoes"><label class="btn btn-linha btn-p"><input type="file" accept="video/*" id="upVid" class="sr-only">${f.video ? 'Trocar vídeo' : 'Enviar vídeo'}</label>${f.video ? '<button type="button" class="btn btn-perigo btn-p" id="rmVid">Remover</button>' : ''}</div>
          <div id="progVid"></div>
          <p class="prog-txt" style="margin-top:10px">Até 300 MB. Vídeos curtos, de 10 a 30 segundos, carregam mais rápido. O Drive leva alguns minutos para processar o vídeo depois do envio.</p>
          <label class="upl-link"><span class="sr-only">Link do vídeo</span><input name="linkVid" placeholder="Ou cole um link (YouTube, Drive)" value="${/^https?:/i.test(f.video) ? esc(f.video) : ''}"></label>
        </div>

        <p class="erro" id="eEx" role="alert"></p>
        <button class="btn btn-ouro largo" type="submit">${novo ? 'Criar exercício' : 'Salvar alterações'}</button>
        ${!novo ? `<p style="text-align:center;margin-top:10px"><button type="button" class="link" id="arquivar">${ex.ativo ? 'Arquivar exercício' : 'Reativar exercício'}</button></p>
          <p class="sub" style="text-align:center;font-size:13px">${ex.ativo ? 'Arquivado some da biblioteca, mas continua nos treinos em que já está.' : 'Este exercício está arquivado.'}</p>` : ''}
      </form>`);
    const form = document.getElementById('fEx');
    const sync = () => {
      f.nome = form.nome.value; f.descricao = form.descricao.value;
      f.foco = form.foco.value === '__outro' ? form.outro.value.trim() : form.foco.value;
      if (form.linkImg.value.trim() !== (/^https?:/i.test(f.imagem) ? f.imagem : '')) f.imagem = form.linkImg.value.trim() || (/^https?:/i.test(f.imagem) ? '' : f.imagem);
      if (form.linkVid.value.trim() !== (/^https?:/i.test(f.video) ? f.video : '')) f.video = form.linkVid.value.trim() || (/^https?:/i.test(f.video) ? '' : f.video);
    };
    form.addEventListener('input', () => { marcar(); });
    form.foco.addEventListener('change', () => { document.getElementById('campoOutro').hidden = form.foco.value !== '__outro'; });
    onAll('[data-local]','click',(e, b) => { f.local = b.dataset.local; marcar(); document.querySelectorAll('[data-local]').forEach(x => x.setAttribute('aria-pressed', x === b)); });
    ['linkImg', 'linkVid'].forEach(n => form[n].addEventListener('change', () => { sync(); render(); }));
    on('#rmImg','click',() => { sync(); f.imagem = ''; marcar(); render(); });
    on('#rmVid','click',() => { sync(); f.video = ''; marcar(); render(); });
    const subir = (inputSel, tipo, progSel, campo) => on(inputSel,'change', async e => {
      const file = e.target.files[0]; e.target.value = ''; if (!file) return;
      sync();
      const prog = document.getElementById(progSel);
      prog.innerHTML = '<div class="prog"><i></i></div><p class="prog-txt">Preparando…</p>';
      const barra = prog.querySelector('i'), txt = prog.querySelector('.prog-txt');
      form.querySelectorAll('button,input[type=file]').forEach(x => x.disabled = true);
      try {
        const idArq = await enviarArquivo(file, tipo, p => { barra.style.width = (p * 100) + '%'; txt.textContent = `Enviando… ${Math.round(p * 100)}%`; });
        f[campo] = idArq; marcar(); render();
        toast(tipo === 'video' ? 'Vídeo enviado. Salve o exercício para aplicar.' : 'Foto enviada. Salve o exercício para aplicar.');
      } catch(err){
        if (err.sessao) return;
        form.querySelectorAll('button,input[type=file]').forEach(x => x.disabled = false);
        txt.textContent = err.message; txt.style.color = 'var(--coral)';
      }
    });
    subir('#upImg', 'imagem', 'progImg', 'imagem');
    subir('#upVid', 'video', 'progVid', 'video');
    form.addEventListener('submit', async e => {
      e.preventDefault(); sync();
      const b = form.querySelector('button[type=submit]'); ocupado(b, 'Salvando…');
      try {
        const salvo = await api('salvar_exercicio', {id:novo ? '' : ex.id, nome:f.nome, descricao:f.descricao, local:f.local, foco:f.foco, imagem:f.imagem, video:f.video});
        sujo = false; st.sujo = false; st.exs = null; st.lib = null;
        toast(novo ? 'Exercício criado' : 'Alterações salvas');
        ir(novo ? '#/exercicios' : '#/exercicios/' + salvo.id);
      } catch(err){ msgErro('eEx', err); livre(b); }
    });
    on('#arquivar','click', async e => {
      const b = e.currentTarget; ocupado(b, 'Salvando…');
      try { await api('arquivar_exercicio', {id:ex.id, ativo:!ex.ativo}); ex.ativo = !ex.ativo; st.lib = null; sujo = false; toast(ex.ativo ? 'Exercício reativado' : 'Exercício arquivado'); ir('#/exercicios'); }
      catch(err){ if (!err.sessao) toast(err.message); livre(b); }
    });
  }
  render();
}

/* =========================================================
   USUÁRIOS (admin)
   ========================================================= */
async function telaUsuarios(){
  pagina(`<div class="cab-aluno"><h1 class="display titulo" style="margin:0">Usuários</h1><button class="btn btn-ouro btn-p" id="novoU">Novo</button></div>
    <div id="listaU" style="margin-top:14px"><p class="sub">Carregando…</p></div>`);
  const el = document.getElementById('listaU');
  let lista = [];
  const desenhar = () => {
    const grupos = [['Personal','Personais'],['Aluno','Alunos'],['Admin','Administradores']];
    el.innerHTML = grupos.map(([t, rot]) => {
      const us = lista.filter(u => u.tipo === t);
      return us.length ? `<h2 class="grupo-titulo">${rot}</h2>${us.map(u => `<button class="u-row" data-u="${esc(u.id)}">
        <span><span class="nome" style="display:block">${esc(u.nome)}${u.admin && t !== 'Admin' ? ' <span class="selo ouro">admin</span>' : ''}</span>
        <span class="sub">${esc(u.email)}${u.personal_nome ? `, com ${esc(u.personal_nome)}` : ''}</span></span><span class="link">Editar</span></button>`).join('')}` : '';
    }).join('');
    onAll('[data-u]','click',(e, b) => modalUsuario(lista.find(u => u.id === b.dataset.u)), el);
  };
  function modalUsuario(u){
    const s = sessao.get();
    const m = modal(`${modalCab(u ? 'Editar usuário' : 'Novo usuário', 'Cancelar')}<form class="modal-corpo" id="fU">
      <label class="campo"><span>Nome</span><input name="nome" value="${esc(u ? u.nome : '')}" required></label>
      <label class="campo"><span>E-mail</span><input type="email" name="email" value="${esc(u ? u.email : '')}" required></label>
      <label class="campo"><span>Tipo de conta</span><select name="tipo">${[['Aluno','Aluno'],['Personal','Personal'],['Admin','Só administrador (não treina nem atende)']].map(([v, l]) => `<option value="${v}" ${(u ? u.tipo : 'Aluno') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="check"><input type="checkbox" name="admin" ${u && u.admin ? 'checked' : ''}><span>Administrador: acessa usuários, todos os alunos e a biblioteca.</span></label>
      <label class="campo"><span>${u ? 'Nova senha (deixe em branco para manter)' : 'Senha inicial'}</span><input type="text" name="senha" autocomplete="off" minlength="6" ${u ? '' : 'required'}><small>Passe a senha para a pessoa e peça para ela trocar no primeiro acesso.</small></label>
      <p class="erro" id="eU" role="alert"></p>
      <button class="btn btn-ouro largo" type="submit">${u ? 'Salvar' : 'Criar conta'}</button>
      ${u && u.id === s.id ? '<p class="sub" style="margin-top:10px;font-size:13px">Mudanças no seu próprio tipo de conta valem a partir do próximo login.</p>' : ''}</form>`, {rotulo:'Usuário'});
    on('#fU','submit', async e => {
      e.preventDefault();
      const f = e.target, b = f.querySelector('button[type=submit]'); ocupado(b, 'Salvando…');
      try {
        lista = await api('salvar_usuario', {id:u ? u.id : '', nome:f.nome.value, email:f.email.value, tipo:f.tipo.value, admin:f.admin.checked, senha:f.senha.value});
        m.fechar(); desenhar(); st.dash = null; toast(u ? 'Usuário atualizado' : 'Conta criada');
      } catch(err){ msgErro('eU', err); livre(b); }
    }, m.el);
  }
  on('#novoU','click',() => modalUsuario(null));
  try { lista = await api('listar_usuarios'); if (el.isConnected) desenhar(); }
  catch(e){ if (!e.sessao) el.innerHTML = `<p class="erro">${esc(e.message)}</p>`; }
}

/* ---------- início ---------- */
rota();
</script>
